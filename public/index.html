<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OHMY MATE</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="logo">OHMY <b>MATE</b></div>
  <div class="tools">
    <select id="lang" aria-label="language">
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="ja" disabled>日本語 (준비 중)</option>
      <option value="zh" disabled>简体中文 (준비 중)</option>
      <option value="vi" disabled>Tiếng Việt (준비 중)</option>
    </select>
    <button id="staffBtn" class="ghost"></button>
    <button id="newBtn" class="primary"></button>
  </div>
</header>
<div id="demoBar" class="demo"></div>
<div id="staffBar" class="staffbar" hidden></div>
<main>
  <section id="chat" aria-live="polite"></section>
  <section id="chips" class="chips"></section>
</main>
<footer class="composer">
  <form id="form">
    <input id="msg" type="text" autocomplete="off" maxlength="500">
    <button class="primary" id="sendBtn" type="submit"></button>
  </form>
  <div class="row">
    <button id="shareBtn" class="ghost"></button>
    <button id="compareBtn" class="ghost"></button>
  </div>
  <p class="foot" id="foot"></p>
</footer>
<dialog id="shareDlg">
  <h2 id="shareTitle"></h2>
  <p id="shareNote"></p>
  <input id="shareUrl" readonly>
  <div class="row"><button id="copyBtn" class="primary"></button><button id="printBtn" class="ghost"></button><button id="closeShare" class="ghost"></button></div>
  <div id="qr"></div>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
