<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OHMY MATE</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#" aria-label="OHMYHOTEL MATE">
    <span class="logochip"><img src="/img/omh-logo.jpeg" alt="OHMYHOTEL"></span>
    <span class="mate">MATE</span>
  </a>
  <div class="tools">
    <select id="lang" aria-label="language">
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="ja" disabled>日本語 (준비 중)</option>
      <option value="zh" disabled>简体中文 (준비 중)</option>
      <option value="vi" disabled>Tiếng Việt (준비 중)</option>
    </select>
    <button id="staffBtn" class="ghost" type="button"></button>
    <button id="newBtn" class="ghost strong" type="button"></button>
  </div>
</header>
<div id="demoBar" class="demo"></div>
<div id="staffBar" class="staffbar" hidden></div>
<main>
  <section id="hero" class="hero">
    <h1 id="heroTitle"></h1>
    <p id="heroSub"></p>
    <div id="chips" class="chips"></div>
  </section>
  <section id="chat" aria-live="polite"></section>
</main>
<footer class="composer">
  <div id="quick" class="quick" hidden></div>
  <form id="form">
    <input id="msg" type="text" autocomplete="off" maxlength="500">
    <button class="primary" id="sendBtn" type="submit"></button>
  </form>
  <div class="row">
    <button id="shareBtn" class="ghost" type="button"></button>
    <button id="compareBtn" class="ghost" type="button"></button>
  </div>
  <p class="foot" id="foot"></p>
</footer>
<dialog id="shareDlg">
  <h2 id="shareTitle"></h2>
  <p id="shareNote"></p>
  <input id="shareUrl" readonly>
  <div class="row">
    <button id="webShareBtn" class="primary" type="button" hidden></button>
    <button id="copyBtn" class="ghost" type="button"></button>
    <button id="fileBtn" class="ghost" type="button" hidden></button>
    <button id="mailBtn" class="ghost" type="button" hidden></button>
    <button id="printBtn" class="ghost" type="button"></button>
  </div>
  <div id="qr"></div>
  <div id="saveBox" class="savebox" hidden>
    <label class="consent"><input type="checkbox" id="consentChk"><span id="consentText"></span></label>
    <div class="row"><button id="saveBtn" class="primary" type="button" disabled></button><button id="delBtn" class="ghost danger" type="button" hidden></button></div>
    <p id="saveMsg" class="small" role="status"></p>
  </div>
  <div class="row end"><button id="closeShare" class="ghost" type="button"></button></div>
</dialog>
<dialog id="pinDlg">
  <form method="dialog" id="pinForm">
    <h2 id="pinTitle"></h2>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
    <p id="pinErr" class="pinerr" hidden></p>
    <div class="row"><button id="pinOk" class="primary" value="ok" type="submit"></button><button id="pinCancel" class="ghost" value="cancel" type="button"></button></div>
  </form>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
